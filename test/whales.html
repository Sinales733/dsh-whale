<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../compare/shared.css">
<style>
  :root{--dive:#7d93f2;--shimmer:#c4d0ff}
  body{padding:16px 22px;box-sizing:border-box}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .card{flex:1;background:#1a1b1f;border:1px solid #24252a;border-radius:12px;padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center}
  .card h3{margin:0 0 2px;font-size:13px;color:#d6d9df;font-weight:600;align-self:flex-start}
  .card p{margin:0 0 6px;font-size:10.5px;line-height:1.35;color:#6b7079;align-self:flex-start;min-height:2.7em}
  .card h3 i{font-style:normal;margin-left:6px;font-size:10px;padding:1px 5px;border-radius:4px;background:#26272c;color:#a6a9b0}.card.off h3 i{background:#1d2a52;color:#9db2ff}.card.new h3 i{background:#14402c;color:#5fe0a0}.card.new{border-color:#1f4a35}
  .card.orig h3 i{background:#26272c;color:#a6a9b0}
  .card.mix{border-color:#2c3a6b}
  .big{height:132px;display:flex;align-items:center;justify-content:center}
  .zoom{zoom:6.5;color:var(--dive)}
  .ic{width:14px;height:14px;flex:none;display:inline-flex;position:relative}
  .running{color:var(--dive);font-size:12px;line-height:22px;display:flex;margin-top:4px}
  .runningContent{display:inline-flex;align-items:center;gap:6px}
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>window.__ModuleLoader__ = { load({ factory }) { window.__plugin = factory(() => ({})); } };</script>
<script src="../lib/client.js"></script>
<script>
  const P = window.__plugin;
  const CSS = document.createElement('style');
  CSS.textContent = '.dshm-whale{position:absolute;inset:0;pointer-events:none}.dshm-rig{position:absolute;left:-37.5%;top:-37.5%;width:175%;height:175%}.dshm-orig{position:absolute;inset:0;background:currentColor;-webkit-mask:var(--dshm-frame) 50%/100% 100% no-repeat;mask:var(--dshm-frame) 50%/100% 100% no-repeat alpha}';
  document.head.appendChild(CSS);
  const CARDS = [
    ['original', '摆尾', '原版', '当前版本自带：静止→连甩三下→回弹', 'orig'],
    ['spin', '旋转', '新版官方', '原地高速转圈，尾柄拧成麻花，带残影', 'off'],
    ['sway', '转身', '新版官方', '左右来回转身，正面时尾叶对称展开', 'off'],
    ['stroke', '划水', '新版官方', '尾叶上下拍水，一缩一展带透视', 'off'],
    ['fluke', '举尾下潜', '新增', '吸气下沉→卷着扬起、尾叶淌水→顶点转身→竖直滑下，两个尾尖先后入水→平滑水印和气泡→回位', 'new'],
    ['spout', '浮头喷水', '新增', '下潜→头顶浮出→冒出一团、冲出水柱、顶上开成两瓣卷边水花→碎成水珠落下→沉下，尾巴回位', 'new'],
    [null, '实际效果', '轮播', '六个随机轮换，每圈都会轮到，不连续重复', 'mix'],
  ];
  const QS = new URLSearchParams(location.search);
  const pick = QS.get('cards') ? QS.get('cards').split(',') : null;
  const row = document.getElementById('row');
  if (pick) row.style.gridTemplateColumns = 'repeat(' + pick.length + ',1fr)';
  const live = [];
  for (const [name, title, tag, desc, cls] of CARDS) {
    if (pick && !pick.includes(name || 'mix')) continue;
    const card = document.createElement('div');
    card.className = 'card ' + cls;
    card.innerHTML = `<h3>${title}<i>${tag}</i></h3><p>${desc}</p><div class="big"><div class="zoom"><span class="ic slot"></span></div></div>` +
      `<div class="running"><span class="runningContent"><span class="ic slot"></span><span class="sh-root"><span class="sh-content">Deep diving for 13s</span><span class="sh-deco"><span class="sh-sweep"><span class="sh-content sh-hl">Deep diving for 13s</span></span></span></span></span></div>`;
    row.appendChild(card);
    const slots = card.querySelectorAll('.slot');
    if (name) {
      for (const s of slots) { const w = P.createWhale(name); s.appendChild(w.el); live.push(w); }
    } else {
      // the rotation: big and small share one controller timeline by mirroring the big one's DOM
      const w = P.createWhale(null); slots[0].appendChild(w.el); live.push(w);
      const mirror = () => { slots[1].innerHTML = ''; slots[1].appendChild(w.el.cloneNode(true)); };
      live.push({ render: mirror });
    }
  }
  function frame(now) { for (const w of live) w.render(now / 1000); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
</script>
</body>
</html>
