<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>鲸尾交接</title>
<style>
  html,body{margin:0;background:#151517;color:#e6e8ec;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  body{padding:14px 16px;box-sizing:border-box;max-width:760px}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:12px;color:#8a8f98}
  .bar button{font:inherit;color:#c9ccd3;background:#24252a;border:1px solid #2f3036;border-radius:6px;padding:3px 10px;cursor:pointer}
  .bar button.on{background:#1d2a52;border-color:#3a4f94;color:#dfe6ff}
  .card{background:#1a1b1f;border:1px solid #24252a;border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center}
  .stage{position:relative;width:240px;height:240px}
  .stage .ic{position:absolute;left:50%;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;color:#7d93f2}
  .now{margin-top:8px;font-size:13px;color:#d6d9df;min-height:1.4em}
  .next{font-size:11.5px;color:#6b7079;min-height:1.3em}
  .running{color:#7d93f2;font-size:12px;line-height:22px;display:flex;margin-top:8px;align-items:center;gap:6px}
  .small{width:14px;height:14px;position:relative;display:inline-block;flex:none}
  .dshm-whale{position:absolute;inset:0;pointer-events:none}
  .dshm-cv{position:absolute;left:-35.7143%;top:-35.7143%;width:171.4286%;height:171.4286%}
  ol{font-size:12px;color:#8a8f98;line-height:1.7;padding-left:20px}
</style>
</head>
<body>
<div class="bar" id="mode">顺序
  <button data-m="tour" class="on">每种交接各来一遍</button><button data-m="random">随机轮播（实际效果）</button><button data-m="spin">只看旋转</button>
</div>
<div class="bar" id="speed">速度
  <button data-s="1" class="on">正常</button><button data-s="0.5">½ 慢放</button><button data-s="0.25">¼ 慢放</button><button data-s="0">暂停</button><button id="restart">从头播放</button>
</div>
<div class="card">
  <div class="stage"><div class="ic" id="big"></div></div>
  <div class="now" id="now"></div>
  <div class="next" id="nexttxt"></div>
  <div class="running"><span class="small" id="small"></span><span>Deep diving for 13s</span></div>
</div>
<ol>
  <li>原版、举尾下潜、喷水之间：首尾都是原版那一帧，直接接上。</li>
  <li>旋转、转身、划水和原版之间、它们彼此之间：用 3D 鲸尾补几帧，从静止姿态转进它们的开头，结束后再转回静止。</li>
  <li>旋转、转身、划水和举尾下潜、喷水之间：在水下交接，官方动画从水里升起或者沉下去。</li>
</ol>
<script>window.__ModuleLoader__ = { load({ factory }) { window.__plugin = factory(() => ({})); } };</script>
<script src="../lib/client.js"></script>
<script>
  const P = window.__plugin;
  const NAME = { original: '原版摆尾', spin: '旋转', sway: '转身', stroke: '划水', fluke: '举尾下潜', spout: '浮头喷水' };
  const TOUR = ['original', 'sway', 'stroke', 'spin', 'fluke', 'spin', 'spout', 'sway', 'original', 'stroke', 'fluke', 'spout', 'spin', 'original'];
  function label(kind) {
    if (!kind) return '';
    if (kind === 'original') return NAME.original;
    const [what, n, range] = kind.split(':');
    if (what === 'rig-in') return `${NAME[n]} · 补帧：从静止姿态转进去`;
    if (what === 'rig-out') return `${NAME[n]} · 补帧：转回静止姿态`;
    if (what === 'rise') return `${NAME[n]} · 从水里升起来`;
    if (what === 'sink') return `${NAME[n]} · 沉进水里`;
    if (what === 'loop') return `${NAME[n]}（官方动画）`;
    if (what === 'surf') {
      const [a, b] = range.split('-').map(Number);
      const P0 = { fluke: 4.3, spout: 4.2 }[n];
      if (a > 0 && b >= P0) return `${NAME[n]} · 从水下回到静止姿态`;
      if (a > 0) return `${NAME[n]} · 从水下接进来，在水下交出去`;
      if (b < P0) return `${NAME[n]} · 在水下交给下一个`;
      return NAME[n];
    }
    return kind;
  }
  let whales = [], speed = 1, T = 0, last = performance.now(), mode = new URLSearchParams(location.search).get('mode') || 'tour';
  for (const x of document.querySelectorAll('#mode button')) x.classList.toggle('on', x.dataset.m === mode);
  function start() {
    for (const w of whales) w.el.remove();
    const order = mode === 'tour' ? TOUR : null;
    whales = [mode === 'spin' ? P.createWhale('spin') : P.createWhale(null, false, order)];
    document.getElementById('big').appendChild(whales[0].el);
    T = 0;
  }
  // the small icon mirrors the big one's canvas, so both always show the same frame
  const small = document.createElement('canvas');
  small.className = 'dshm-cv'; small.width = small.height = 48;
  const sw = document.createElement('span'); sw.className = 'dshm-whale'; sw.appendChild(small);
  document.getElementById('small').appendChild(sw);
  document.getElementById('mode').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.m;
    for (const x of document.querySelectorAll('#mode button')) x.classList.toggle('on', x === b);
    start();
  });
  document.getElementById('speed').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'restart') { start(); return; }
    speed = Number(b.dataset.s);
    for (const x of document.querySelectorAll('#speed button[data-s]')) x.classList.toggle('on', x === b);
  });
  const imgs = Object.values(P.whaleImages()).flat();
  const ready = (im) => (im.getContext ? new Promise((r) => { const chk = () => (im.ready ? r() : setTimeout(chk, 20)); chk(); }) : im.complete ? 1 : new Promise((r) => { im.onload = im.onerror = r; }));
Promise.all(imgs.map(ready)).then(() => {
    start();
    const loop = (now) => {
      T += (Math.max(0, now - last) / 1000) * speed; last = now;
      const w = whales[0];
      w.render(100 + T);
      const sc = small.getContext('2d'); sc.clearRect(0, 0, 48, 48); sc.drawImage(w.el.querySelector('canvas'), 0, 0);
      const st = w.state();
      document.getElementById('now').textContent = label(st.clip);
      document.getElementById('nexttxt').textContent = st.nextName ? `下一个：${NAME[st.nextName]}` : '';
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    window.__ready = true;
  });
</script>
</body>
</html>
