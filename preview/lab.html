<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>splash lab</title>
<style>
  html,body{margin:0;background:#000;color:#ccc;font:12px monospace}
  #stage{position:absolute;left:0;top:0;border:0;visibility:hidden}
  #sheet{display:block}
  #info{white-space:pre;padding:6px}
</style>
</head>
<body>
<iframe id="stage"></iframe>
<div id="info">running…</div>
<canvas id="sheet"></canvas>
<script>
// Frame-exact contact sheets of the launch splash, stepped on a virtual clock (preview/lab-clock.js).
//   ?dir=_all|<scene>      lab build folder (node tools/build-splash.mjs [--lab <scene>])
//   &scene=<name>&theme=dark|light&w=1280&h=820
//   &times=3.3:4.6:0.05    capture times in seconds (a:b:step, or a comma list)
//   &exitAt=3.0|none       when the app is "ready" (the scene still holds the exit until its readyAt)
//   &crop=x,y,w,h          part of the splash to show in each cell (CSS px), default whole
//   &cols=4&cw=480         cells per row, cell width (px)
//   &fps=60                frames per second of the stepped clock
// Result: window.__labDone = { dataURL, perf: { avg, p95, max, frames }, exitStart }.
const Q = new URLSearchParams(location.search);
const dir = Q.get('dir') || '_all', scene = Q.get('scene') || '', theme = Q.get('theme') || 'dark';
const VW = Number(Q.get('w') || 1280), VH = Number(Q.get('h') || 820);
const fps = Number(Q.get('fps') || 60), STEP = 1000 / fps;
const exitAt = Q.get('exitAt') === 'none' ? Infinity : Number(Q.get('exitAt') || 3.0);
const cols = Number(Q.get('cols') || 4), CW = Number(Q.get('cw') || 480);
const crop = (Q.get('crop') || `0,0,${VW},${VH}`).split(',').map(Number);
function parseTimes(s) {
  if (!s) return [0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5];
  if (s.includes(':')) {
    const [a, b, st] = s.split(':').map(Number), out = [];
    for (let k = 0; a + k * st <= b + 1e-9; k++) out.push(+(a + k * st).toFixed(4));
    return out;
  }
  return s.split(',').map(Number);
}
// &spin=r,g,b — hand the splash a measured spinner record whose arc has that colour (track: same rgb at 12%),
// to check how the canvas adopts a restyled spinner. Without it the exit gets no record (fallback mode).
function fakeSpec(w) {
  if (!Q.get('spin')) return null;
  const c = Q.get('spin');
  const box = { text: '', x: 0, y: 0, w: 1, h: 1, font: '16px sans-serif', letterSpacing: 'normal', color: 'rgb(' + c + ')' };
  return { vw: w.innerWidth, vh: w.innerHeight, phase: 0, dur: 800, at: Date.now(), wordmark: box, hint: box,
    spinner: { cx: VW / 2, cy: VH / 2 + 3, size: 20, bw: 2, border: 'rgba(' + c + ', 0.12)' },
    after: { background: 'conic-gradient(rgb(' + c + ') 0deg, rgb(' + c + ') 72deg, rgba(0, 0, 0, 0) 72deg)', mask: 'none' } };
}
const times = parseTimes(Q.get('times'));
const stage = document.getElementById('stage');
stage.style.width = VW + 'px';
stage.style.height = VH + 'px';
stage.src = `lab/${dir}/splash.html?scene=${encodeURIComponent(scene)}&theme=${theme}&lang=zh&v=0.0.0&_=${Date.now()}`;

function wait() {
  const w = stage.contentWindow;
  if (!w || !w.__lab || !w.__lab.started()) return setTimeout(wait, 5);
  run(w);
}
setTimeout(wait, 5);

// ?scan=a:b — instead of a sheet, step at the clock rate from 0 to b and measure how much the picture
// changes from each frame to the next between a and b (mean alpha difference on a 320 px copy). A frame
// whose change is far above its neighbours' is a jump (pop, snap, flicker); a run of frames with no change
// at all, while the scene is not finished, is a frozen hold. &sw=320 sets the width of that copy (use 640 or
// 1280 for sparse hairline scenes) and &floor=0.0002 the smallest change that can count as a spike.
const scanArg = Q.get('scan') ? Q.get('scan').split(':').map(Number) : null;
function runScan(w) {
  const lab = w.__lab;
  const fx = w.document.getElementById('fx');
  const SW = Number(Q.get('sw') || 320), SH = Math.round((SW * VH) / VW);
  const FLOOR = Number(Q.get('floor') || 0.0002);
  const small = document.createElement('canvas');
  small.width = SW; small.height = SH;
  const sg = small.getContext('2d', { willReadFrequently: true });
  let prev = null, asked = false;
  const series = [], costs = [];
  while (lab.now() < scanArg[1] * 1000) {
    if (!asked && lab.now() >= exitAt * 1000) { asked = true; w.__dshSplashExit && w.__dshSplashExit(fakeSpec(w)); }
    const ms = lab.step(STEP);
    const t = lab.now() / 1000;
    if (t > 0.6) costs.push(ms);
    if (t < scanArg[0]) continue;
    sg.clearRect(0, 0, SW, SH);
    sg.drawImage(fx, 0, 0, SW, SH);
    const d = sg.getImageData(0, 0, SW, SH).data;
    const a = new Uint8Array(SW * SH);
    for (let j = 0; j < a.length; j++) a[j] = d[j * 4 + 3];
    if (prev) {
      let s = 0;
      for (let j = 0; j < a.length; j++) s += Math.abs(a[j] - prev[j]);
      const es = w.__dshExitAt;
      series.push({ t: +t.toFixed(4), d: s / a.length / 255, exit: es !== undefined && es >= 0 ? +(t - es).toFixed(3) : null });
    }
    prev = a;
  }
  const med = (arr) => { const s = arr.slice().sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : 0; };
  const spikes = [];
  series.forEach((p, i) => {
    const around = series.slice(Math.max(0, i - 8), i).concat(series.slice(i + 1, i + 9)).map((q) => q.d);
    const m = med(around);
    const ratio = p.d / Math.max(m, 1e-5);
    if (ratio > 2.2 && p.d > FLOOR) spikes.push({ t: p.t, exit: p.exit, d: +p.d.toFixed(5), ratio: +ratio.toFixed(2) });
  });
  const frozen = [];
  let run0 = null;
  series.forEach((p) => {
    if (p.d < 2e-6) { if (run0 === null) run0 = p.t; }
    else { if (run0 !== null && p.t - run0 > 0.3) frozen.push({ from: run0, to: p.t }); run0 = null; }
  });
  if (run0 !== null && series.length && series[series.length - 1].t - run0 > 0.3) frozen.push({ from: run0, to: series[series.length - 1].t, open: true });
  const stat = (a) => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y); return { avg: +(a.reduce((p, c) => p + c, 0) / a.length).toFixed(2), p95: +s[Math.floor(s.length * 0.95)].toFixed(2), max: +s[s.length - 1].toFixed(2) }; };
  const scan = { frames: series.length, medianD: +med(series.map((p) => p.d)).toFixed(5), maxD: +Math.max(...series.map((p) => p.d)).toFixed(5), spikes: spikes.slice(0, 40), spikeCount: spikes.length, frozen, exitStart: w.__dshExitAt };
  document.getElementById('info').textContent = JSON.stringify({ scene, scan, perf: stat(costs) }, null, 1);
  const c = document.getElementById('sheet');
  c.width = 1; c.height = 1;
  window.__labDone = { dataURL: c.toDataURL('image/png'), perf: { all: stat(costs), dpr: devicePixelRatio }, scan, exitStart: w.__dshExitAt, w: 1, h: 1 };
}

function run(w) {
  if (scanArg) return runScan(w);
  const lab = w.__lab;
  const fx = w.document.getElementById('fx');
  const bg = theme === 'light' ? '#ffffff' : '#151517';
  const CH = Math.round((CW * crop[3]) / crop[2]);
  const rows = Math.ceil(times.length / cols);
  const sheet = document.getElementById('sheet');
  sheet.width = cols * CW;
  sheet.height = rows * (CH + 16);
  const g = sheet.getContext('2d');
  g.fillStyle = '#000';
  g.fillRect(0, 0, sheet.width, sheet.height);
  const costs = [], exitCosts = [];
  let asked = false, i = 0;
  const end = Math.max(...times);
  while (i < times.length) {
    const T = times[i] * 1000;
    if (!asked && lab.now() >= exitAt * 1000) { asked = true; w.__dshSplashExit && w.__dshSplashExit(fakeSpec(w)); }
    if (lab.now() + 1e-6 >= T) {
      // capture this frame
      const k = fx.width / VW;
      const X = (i % cols) * CW, Y = Math.floor(i / cols) * (CH + 16);
      g.fillStyle = bg;
      g.fillRect(X, Y + 16, CW, CH);
      g.drawImage(fx, crop[0] * k, crop[1] * k, crop[2] * k, crop[3] * k, X, Y + 16, CW, CH);
      const es = w.__dshExitAt;
      const lbl = `t ${times[i].toFixed(2)}` + (es !== undefined && es >= 0 ? `  exit+${(times[i] - es).toFixed(2)}` : '');
      g.fillStyle = '#ff0';
      g.font = '11px monospace';
      g.fillText(lbl, X + 3, Y + 12);
      g.strokeStyle = '#333';
      g.strokeRect(X + 0.5, Y + 16.5, CW - 1, CH - 1);
      i++;
      continue;
    }
    const ms = lab.step(Math.min(STEP, T - lab.now()));
    const t = lab.now() / 1000;
    if (t > 0.6) (w.__dshExitAt !== undefined && w.__dshExitAt >= 0 ? exitCosts : costs).push(ms);
    if (lab.now() > end * 1000 + 5000) break;
  }
  const stat = (a) => {
    if (!a.length) return null;
    const s = a.slice().sort((x, y) => x - y);
    return { frames: a.length, avg: +(a.reduce((p, c) => p + c, 0) / a.length).toFixed(2), p95: +s[Math.floor(s.length * 0.95)].toFixed(2), max: +s[s.length - 1].toFixed(2) };
  };
  const perf = { idle: stat(costs), exit: stat(exitCosts), dpr: devicePixelRatio };
  document.getElementById('info').textContent = JSON.stringify({ scene, perf, exitStart: w.__dshExitAt });
  window.__labDone = { dataURL: sheet.toDataURL('image/png'), perf, exitStart: w.__dshExitAt, w: sheet.width, h: sheet.height };
}
</script>
</body>
</html>
