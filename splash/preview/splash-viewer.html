<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>启动动画查看器</title>
<style>
  html,body{margin:0;background:#0e0e10;color:#e6e8ec;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  body{padding:10px 12px;box-sizing:border-box}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px;font-size:12px;color:#8a8f98}
  .bar button{font:inherit;color:#c9ccd3;background:#24252a;border:1px solid #2f3036;border-radius:6px;padding:3px 10px;cursor:pointer}
  .bar button.on{background:#1d2a52;border-color:#3a4f94;color:#dfe6ff}
  .frame{position:relative;width:100%;aspect-ratio:1280/820;border:1px solid #2a2b30;border-radius:6px;overflow:hidden;background:#151517}
  iframe{position:absolute;left:0;top:0;width:1280px;height:820px;border:0;transform-origin:0 0}
  #clock{font:12px Consolas,monospace;color:#9aa0aa;margin-left:auto}
</style>
</head>
<body>
<div class="bar" id="scenes">场景</div>
<div class="bar" id="speed">速度
  <button data-s="1" class="on">正常</button><button data-s="0.5">½ 慢放</button><button data-s="0.25">¼ 慢放</button><button data-s="0">暂停</button>
</div>
<div class="bar" id="exit">软件启动好于
  <button data-e="3" class="on">3 秒内（最快）</button><button data-e="6">6 秒</button>
  <button id="now">现在结束</button><button id="replay">重播</button><span id="clock"></span>
</div>
<div class="frame" id="frame"><iframe id="ifr"></iframe></div>
<script>
  // The real splash (../splash/splash.html) at the real window size (1280x820), scaled to fit. Its clock is
  // slowed from out here (requestAnimationFrame, performance.now, setTimeout and CSS transitions), and the
  // app's "ready" is simulated: like the main process, the exit is asked for no earlier than 3 s after launch,
  // and the scene itself holds it until its whale has been on screen long enough. No boot-card measurements are
  // passed, so the splash finishes on its own replica of the boot card.
  const SCENES = [['construct', 'CONSTRUCT 结构'], ['orbit', 'ORBIT 星球'], ['signal', 'SIGNAL 示波器'], ['weave', 'WEAVE 编织'], ['pulsar', 'PULSAR 脉冲星'], ['current', 'CURRENT 水流'], ['spline', 'SPLINE 放样'], ['hanzi', 'HANZI 汉字'], ['shadow', 'SHADOW 投影'], ['echo', 'ECHO 声呐']];
  const q = new URLSearchParams(location.search);
  let scene = q.get('scene') || 'construct', speed = 1, readyAt = 3, theme = q.get('theme') || 'dark';
  const ifr = document.getElementById('ifr'), frameEl = document.getElementById('frame');
  const sb = document.getElementById('scenes');
  for (const [id, label] of SCENES) { const b = document.createElement('button'); b.dataset.n = id; b.textContent = label; sb.appendChild(b); }
  const mark = () => {
    for (const b of sb.querySelectorAll('button')) b.classList.toggle('on', b.dataset.n === scene);
  };
  const fit = () => { ifr.style.transform = `scale(${frameEl.clientWidth / 1280})`; };
  addEventListener('resize', fit);

  // virtual clock shared with the iframe
  let rBase = performance.now(), vBase = 0, exitAsked = false, run = 0;
  const vnow = (r = performance.now()) => vBase + (r - rBase) * speed;
  function setSpeed(s) { const r = performance.now(); vBase = vnow(r); rBase = r; speed = s; }

  function patch(win) {
    const rafO = win.requestAnimationFrame.bind(win), stO = win.setTimeout.bind(win);
    win.performance.now = () => vnow();
    win.requestAnimationFrame = (cb) => rafO(() => {
      for (const a of win.document.getAnimations()) a.playbackRate = speed;   // CSS transitions follow
      cb(vnow());
    });
    win.setTimeout = (fn, ms = 0, ...a) => {
      const due = vnow() + ms;
      const tick = () => (vnow() >= due ? fn(...a) : stO(tick, 16));
      return stO(tick, Math.min(ms, 16));
    };
  }
  async function start() {
    mark(); fit();
    const my = ++run; exitAsked = true;            // nothing to end until the new splash is in
    // refresh the browser's cached copies first, so an edited splash shows up on replay
    await Promise.all(['../splash/splash.js', '../splash/splash.css'].map((u) => fetch(u, { cache: 'reload' }).catch(() => null)));
    if (my !== run) return;
    rBase = performance.now(); vBase = 0;
    ifr.src = `../splash/splash.html?scene=${scene}&theme=${theme}&lang=zh&v=0.0.0&_=${Date.now()}`;
    // patch the new document as soon as its script has run (before the scene's first frame)
    const wait = () => {
      if (my !== run) return;
      const w = ifr.contentWindow;
      if (w && w.__dshSplashScene === scene && !w.__patched) { w.__patched = true; rBase = performance.now(); vBase = 0; exitAsked = false; patch(w); return; }
      setTimeout(wait, 2);
    };
    wait();
  }
  function tick() {
    const t = vnow() / 1000, w = ifr.contentWindow;
    document.getElementById('clock').textContent = `T+${t.toFixed(2)}s`;
    if (w && w.__patched && !exitAsked && t >= readyAt && w.__dshSplashExit) { exitAsked = true; w.__dshSplashExit(null); }
    requestAnimationFrame(tick);
  }
  sb.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; scene = b.dataset.n; start(); });
  document.getElementById('speed').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    setSpeed(Number(b.dataset.s));
    for (const x of document.querySelectorAll('#speed button')) x.classList.toggle('on', x === b);
  });
  document.getElementById('exit').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'replay') return start();
    if (b.id === 'now') { const w = ifr.contentWindow; if (w && w.__dshSplashExit && !exitAsked) { exitAsked = true; w.__dshSplashExit(null); } return; }
    readyAt = Math.max(3, Number(b.dataset.e));
    for (const x of document.querySelectorAll('#exit button[data-e]')) x.classList.toggle('on', x === b);
    start();
  });
  start(); tick();
</script>
</body>
</html>
